<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon MCP Tester</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --ink: #102039;
      --muted: #5a6880;
      --line: #d8e0ee;
      --accent: #0b6ef3;
      --accent-2: #17a96b;
      --danger: #c0392b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 10% 0%, #ffffff 0%, #eef3ff 45%, var(--bg) 100%);
      color: var(--ink);
    }

    .wrap {
      max-width: 1050px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(16, 32, 57, 0.06);
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 980px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 6px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }

    button.secondary { background: #5b6b84; }
    button.success { background: var(--accent-2); }

    .status {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .ok { color: var(--accent-2); }
    .err { color: var(--danger); }

    .log {
      white-space: pre-wrap;
      max-height: 280px;
      overflow: auto;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fafcff;
      font-size: 13px;
      color: #26364f;
    }

    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      background: #f8fbff;
      color: #33445f;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Horizon MCP Tester</h1>
      <p class="sub">Free local UI to connect and test your deployed FastMCP server.</p>
      <p class="sub">
        <span class="pill">No paid ChatGPT/Claude needed</span>
        <span class="pill">Direct MCP protocol calls</span>
      </p>
    </div>

    <div class="card grid">
      <div>
        <label for="serverUrl">MCP Server URL</label>
        <input id="serverUrl" value="https://quiet-amaranth-toad.fastmcp.app/mcp" />
      </div>
      <div>
        <label for="token">Bearer Token (from Horizon)</label>
        <input id="token" type="password" placeholder="paste access token" />
      </div>
      <div class="row" style="grid-column: 1 / -1;">
        <button id="connectBtn">Connect + Load Tools</button>
        <button id="oauthBtn" class="secondary" type="button">Login with Horizon OAuth</button>
        <button id="clearBtn" class="secondary" type="button">Clear Log</button>
      </div>
      <div id="connectionStatus" class="status" style="grid-column: 1 / -1;"></div>
    </div>

    <div class="card grid">
      <div>
        <label for="toolName">Tool</label>
        <select id="toolName"></select>
      </div>
      <div>
        <label for="toolArgs">Arguments (JSON object)</label>
        <textarea id="toolArgs">{}</textarea>
      </div>
      <div class="row" style="grid-column: 1 / -1;">
        <button id="callBtn" class="success">Call Tool</button>
      </div>
      <div>
        <label for="toolResult">Tool Result</label>
        <textarea id="toolResult" readonly></textarea>
      </div>
      <div>
        <label>Debug Log</label>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>

  <script>
    let rpcId = 1;
    let sessionId = null;
    let serverUrl = "";
    let bearer = "";

    const el = {
      serverUrl: document.getElementById("serverUrl"),
      token: document.getElementById("token"),
      connectBtn: document.getElementById("connectBtn"),
      oauthBtn: document.getElementById("oauthBtn"),
      clearBtn: document.getElementById("clearBtn"),
      callBtn: document.getElementById("callBtn"),
      status: document.getElementById("connectionStatus"),
      toolName: document.getElementById("toolName"),
      toolArgs: document.getElementById("toolArgs"),
      toolResult: document.getElementById("toolResult"),
      log: document.getElementById("log")
    };

    function appendLog(msg) {
      const t = new Date().toLocaleTimeString();
      el.log.textContent += `[${t}] ${msg}\n`;
      el.log.scrollTop = el.log.scrollHeight;
    }

    function setStatus(message, ok) {
      el.status.textContent = message;
      el.status.className = `status ${ok ? "ok" : "err"}`;
    }

    function parsePossiblySSE(text) {
      const trimmed = (text || "").trim();
      if (!trimmed) {
        return {};
      }

      try {
        return JSON.parse(trimmed);
      } catch {
        // Continue with SSE parsing fallback.
      }

      // Handle event-stream style responses by extracting the last JSON payload
      // from `data:` lines.
      const dataLines = trimmed
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.startsWith("data:"))
        .map(line => line.slice(5).trim())
        .filter(Boolean);

      for (let i = dataLines.length - 1; i >= 0; i--) {
        try {
          return JSON.parse(dataLines[i]);
        } catch {
          // Keep scanning backward for a parseable JSON line.
        }
      }

      return { raw: text };
    }

    function baseUrlFromMcpUrl(mcpUrl) {
      const u = new URL(mcpUrl);
      return `${u.protocol}//${u.host}`;
    }

    function randomString(len = 64) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      return Array.from(arr, x => chars[x % chars.length]).join("");
    }

    function b64url(bytes) {
      let binary = "";
      bytes.forEach(b => {
        binary += String.fromCharCode(b);
      });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    async function sha256(input) {
      const data = new TextEncoder().encode(input);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return new Uint8Array(digest);
    }

    async function startOAuthLogin() {
      try {
        serverUrl = el.serverUrl.value.trim();
        if (!serverUrl) {
          setStatus("Please provide server URL first.", false);
          return;
        }

        const base = baseUrlFromMcpUrl(serverUrl);
        appendLog(`Discovering OAuth metadata from ${base}`);

        const asResp = await fetch(`${base}/.well-known/oauth-authorization-server`);
        if (!asResp.ok) {
          throw new Error(`OAuth discovery failed: HTTP ${asResp.status}`);
        }
        const asMeta = await asResp.json();

        const prResp = await fetch(`${base}/.well-known/oauth-protected-resource`);
        if (!prResp.ok) {
          throw new Error(`Protected resource discovery failed: HTTP ${prResp.status}`);
        }
        const prMeta = await prResp.json();
        const resource = prMeta.resource || base;

        const redirectUri = `${window.location.origin}${window.location.pathname}`;
        const regResp = await fetch(asMeta.registration_endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            client_name: "Horizon MCP Tester",
            redirect_uris: [redirectUri],
            grant_types: ["authorization_code", "refresh_token"],
            response_types: ["code"],
            token_endpoint_auth_method: "none"
          })
        });

        if (!regResp.ok) {
          const t = await regResp.text();
          throw new Error(`Client registration failed: HTTP ${regResp.status} ${t}`);
        }

        const reg = await regResp.json();
        const clientId = reg.client_id;
        if (!clientId) {
          throw new Error("Registration succeeded but client_id missing.");
        }

        const codeVerifier = randomString(96);
        const codeChallenge = b64url(await sha256(codeVerifier));
        const state = randomString(24);

        sessionStorage.setItem("mcp_oauth_client_id", clientId);
        sessionStorage.setItem("mcp_oauth_verifier", codeVerifier);
        sessionStorage.setItem("mcp_oauth_state", state);
        sessionStorage.setItem("mcp_oauth_token_endpoint", asMeta.token_endpoint);
        sessionStorage.setItem("mcp_oauth_redirect_uri", redirectUri);
        sessionStorage.setItem("mcp_oauth_resource", resource);

        const authUrl = new URL(asMeta.authorization_endpoint);
        authUrl.searchParams.set("response_type", "code");
        authUrl.searchParams.set("client_id", clientId);
        authUrl.searchParams.set("redirect_uri", redirectUri);
        authUrl.searchParams.set("scope", "openid profile email offline_access");
        authUrl.searchParams.set("resource", resource);
        authUrl.searchParams.set("code_challenge", codeChallenge);
        authUrl.searchParams.set("code_challenge_method", "S256");
        authUrl.searchParams.set("state", state);

        appendLog("Redirecting to Horizon login...");
        window.location.href = authUrl.toString();
      } catch (err) {
        setStatus("OAuth login setup failed.", false);
        appendLog(`ERROR: ${err.message}`);
      }
    }

    async function completeOAuthIfRedirected() {
      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");
      const state = url.searchParams.get("state");

      if (!code) {
        return;
      }

      try {
        const expectedState = sessionStorage.getItem("mcp_oauth_state");
        if (!expectedState || state !== expectedState) {
          throw new Error("OAuth state mismatch.");
        }

        const clientId = sessionStorage.getItem("mcp_oauth_client_id");
        const codeVerifier = sessionStorage.getItem("mcp_oauth_verifier");
        const tokenEndpoint = sessionStorage.getItem("mcp_oauth_token_endpoint");
        const redirectUri = sessionStorage.getItem("mcp_oauth_redirect_uri");
        const resource = sessionStorage.getItem("mcp_oauth_resource");

        if (!clientId || !codeVerifier || !tokenEndpoint || !redirectUri) {
          throw new Error("OAuth session data missing. Please click Login with Horizon OAuth again.");
        }

        appendLog("Exchanging authorization code for access token...");
        const form = new URLSearchParams();
        form.set("grant_type", "authorization_code");
        form.set("client_id", clientId);
        form.set("code", code);
        form.set("redirect_uri", redirectUri);
        form.set("code_verifier", codeVerifier);
        if (resource) {
          form.set("resource", resource);
        }

        const tokenResp = await fetch(tokenEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: form.toString()
        });

        const tokenText = await tokenResp.text();
        let tokenJson = {};
        try {
          tokenJson = tokenText ? JSON.parse(tokenText) : {};
        } catch {
          tokenJson = { raw: tokenText };
        }

        if (!tokenResp.ok || !tokenJson.access_token) {
          throw new Error(`Token exchange failed: HTTP ${tokenResp.status} ${JSON.stringify(tokenJson)}`);
        }

        el.token.value = tokenJson.access_token;
        bearer = tokenJson.access_token;
        setStatus("OAuth login successful. Token auto-filled.", true);
        appendLog("OAuth login complete. You can now click Connect + Load Tools.");

        url.searchParams.delete("code");
        url.searchParams.delete("state");
        window.history.replaceState({}, document.title, url.pathname);
      } catch (err) {
        setStatus("OAuth callback failed.", false);
        appendLog(`ERROR: ${err.message}`);
      }
    }

    function buildHeaders(withSession = true) {
      const headers = {
        "Content-Type": "application/json",
        "Accept": "application/json, text/event-stream",
        "mcp-protocol-version": "2025-06-18"
      };
      if (bearer) {
        headers["Authorization"] = `Bearer ${bearer}`;
      }
      if (withSession && sessionId) {
        headers["mcp-session-id"] = sessionId;
      }
      return headers;
    }

    async function rpc(method, params = {}, includeSession = true) {
      const payload = {
        jsonrpc: "2.0",
        id: rpcId++,
        method,
        params
      };

      const res = await fetch(serverUrl, {
        method: "POST",
        headers: buildHeaders(includeSession),
        body: JSON.stringify(payload)
      });

      const maybeSession = res.headers.get("mcp-session-id");
      if (maybeSession) {
        sessionId = maybeSession;
      }

      const text = await res.text();
      const data = parsePossiblySSE(text);

      if (!res.ok || data.error) {
        const msg = data.error ? JSON.stringify(data.error, null, 2) : JSON.stringify(data, null, 2);
        throw new Error(`HTTP ${res.status} ${res.statusText}\n${msg}`);
      }

      if (data.raw) {
        appendLog(`WARN: Unparsed response body received for method '${method}'.`);
      }

      return data;
    }

    async function sendInitializedNotification() {
      const payload = {
        jsonrpc: "2.0",
        method: "notifications/initialized",
        params: {}
      };

      await fetch(serverUrl, {
        method: "POST",
        headers: buildHeaders(true),
        body: JSON.stringify(payload)
      });
    }

    async function connectAndLoadTools() {
      serverUrl = el.serverUrl.value.trim();
      bearer = el.token.value.trim();
      sessionId = null;

      if (!serverUrl) {
        setStatus("Please provide server URL.", false);
        return;
      }

      try {
        appendLog(`Connecting to ${serverUrl}`);

        const initResult = await rpc(
          "initialize",
          {
            protocolVersion: "2025-06-18",
            capabilities: {},
            clientInfo: { name: "Horizon MCP Tester", version: "1.0.0" }
          },
          false
        );

        appendLog(`Initialize OK. Session: ${sessionId || "(none)"}`);
        appendLog(`Server protocol: ${initResult?.result?.protocolVersion || "unknown"}`);

        await sendInitializedNotification();
        appendLog("Sent notifications/initialized");

        const toolsResp = await rpc("tools/list", {});
        const tools = toolsResp?.result?.tools || [];

        el.toolName.innerHTML = "";
        for (const t of tools) {
          const opt = document.createElement("option");
          opt.value = t.name;
          opt.textContent = t.name;
          el.toolName.appendChild(opt);
        }

        if (tools.length === 0) {
          setStatus("Connected, but no tools returned.", false);
          appendLog("tools/list returned 0 tools.");
          appendLog(`tools/list payload: ${JSON.stringify(toolsResp, null, 2)}`);
        } else {
          setStatus(`Connected. Loaded ${tools.length} tools.`, true);
          appendLog(`Loaded tools: ${tools.map(t => t.name).join(", ")}`);
          el.toolResult.value = JSON.stringify(toolsResp.result, null, 2);
        }
      } catch (err) {
        setStatus("Connection failed. Check token/URL and try again.", false);
        appendLog(`ERROR: ${err.message}`);
        if (String(err.message).includes("Bearer token required")) {
          appendLog("TIP: Click 'Login with Horizon OAuth' to auto-generate a token.");
        }
      }
    }

    async function callTool() {
      const name = el.toolName.value;
      if (!name) {
        setStatus("No tool selected.", false);
        return;
      }

      let args = {};
      try {
        args = JSON.parse(el.toolArgs.value || "{}");
      } catch {
        setStatus("Arguments must be valid JSON.", false);
        return;
      }

      try {
        appendLog(`Calling tool: ${name}`);
        const resp = await rpc("tools/call", { name, arguments: args });
        el.toolResult.value = JSON.stringify(resp.result, null, 2);
        setStatus(`Tool '${name}' executed successfully.`, true);
        appendLog(`Tool '${name}' success.`);
      } catch (err) {
        setStatus(`Tool '${name}' failed.`, false);
        appendLog(`ERROR: ${err.message}`);
      }
    }

    el.connectBtn.addEventListener("click", connectAndLoadTools);
    el.oauthBtn.addEventListener("click", startOAuthLogin);
    el.callBtn.addEventListener("click", callTool);
    el.clearBtn.addEventListener("click", () => { el.log.textContent = ""; });
    completeOAuthIfRedirected();
  </script>
</body>
</html>
