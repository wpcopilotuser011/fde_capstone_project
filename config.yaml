# Configuration Template
# Copy this to config.local.yaml and fill in actual values
# config.local.yaml is gitignored for security

app:
  name: "Intelligent Referral Management Platform"
  version: "1.0.0"
  environment: "development"
  host: "0.0.0.0"
  port: 8000

ai:
  # Model configurations
  # llm_model is intentionally NOT hardcoded here - set it via the
  # LLM_MODEL_NAME environment variable (see .env / .env.example).
  # If LLM_MODEL_NAME is unset, code falls back to a generic default.
  temperature: 0.7
  max_tokens: 2000
  
mcp:
  # MCP server configurations
  enabled: true
  servers:
    - name: "document_processor"
      type: "stdio"
    - name: "specialist_recommender"
      type: "stdio"
    - name: "eligibility_checker"
      type: "stdio"

database:
  # Primary DB is MySQL, configured entirely via env vars: DB_TYPE,
  # MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DATABASE
  # (see .env). If MySQL can't be reached, the app automatically falls
  # back to the local SQLite file below instead of failing to start.
  type: "mysql"
  path: "data/referrals.db"  # SQLite fallback path

external_systems:
  # Mock mode for development
  mock_mode: true
  
  ehr:
    base_url: "http://mock-ehr:8001"
    timeout: 30
    
  payer:
    base_url: "http://mock-payer:8002"
    timeout: 30
    
  scheduling:
    base_url: "http://mock-scheduling:8003"
    timeout: 30

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/application.log"

security:
  enable_audit_log: true
  audit_log_path: "logs/audit.log"
