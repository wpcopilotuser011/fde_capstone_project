# Configuration Template
# Copy this to config.local.yaml and fill in actual values
# config.local.yaml is gitignored for security

app:
  name: "Intelligent Referral Management Platform"
  version: "1.0.0"
  environment: "development"
  host: "0.0.0.0"
  port: 8000

ai:
  # Model configurations
  llm_model: "REPLACE_WITH_YOUR_MODEL"  # e.g., gpt-4, claude-3-sonnet
  temperature: 0.7
  max_tokens: 2000
  
mcp:
  # MCP server configurations
  enabled: true
  servers:
    - name: "document_processor"
      type: "stdio"
    - name: "specialist_recommender"
      type: "stdio"
    - name: "eligibility_checker"
      type: "stdio"

database:
  type: "sqlite"
  path: "data/referrals.db"

external_systems:
  # Mock mode for development
  mock_mode: true
  
  ehr:
    base_url: "http://mock-ehr:8001"
    timeout: 30
    
  payer:
    base_url: "http://mock-payer:8002"
    timeout: 30
    
  scheduling:
    base_url: "http://mock-scheduling:8003"
    timeout: 30

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/application.log"

security:
  enable_audit_log: true
  audit_log_path: "logs/audit.log"
